name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: কোড নামানো
        uses: actions/checkout@v4

      - name: Node.js সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: নির্ভরতা ইনস্টল
        run: npm install

      - name: pdf.js / pdf-lib কপি (অফলাইন লাইব্রেরি)
        run: npm run prepare-web

      - name: Android প্রজেক্ট তৈরি
        run: npx cap add android

      - name: অ্যাপ আইকন তৈরি
        continue-on-error: true
        run: |
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android --iconBackgroundColor '#2f6df6' --iconBackgroundColorDark '#2f6df6' --splashBackgroundColor '#e9ecf2' --splashBackgroundColorDark '#1b1e26'

      - name: ওয়েব ফাইল Android-এ সিঙ্ক
        run: npx cap sync android

      - name: Debug APK বিল্ড
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: pdf-marker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
